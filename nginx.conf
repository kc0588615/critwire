# Reverse proxy for the Critwire app container.
# Runs inside the compose network: `app` resolves to the Next.js container.
#
# TLS: Cloudflare terminates public SSL; the origin uses a Cloudflare
# Origin CA certificate (mode: Full (strict)). See docs/deploy.md.

upstream critwire_app {
  server app:3000;
}

# Redirect plain HTTP to HTTPS (Cloudflare always speaks 443 to origin
# in Full (strict), so this only matters for direct probes).
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/origin.pem;
  ssl_certificate_key /etc/nginx/certs/origin-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Uploads go through the admin panel (media collection).
  client_max_body_size 25m;

  # Security headers (Cloudflare adds some; these cover direct access).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://critwire_app;
    proxy_http_version 1.1;

    # Host header drives custom-domain resolution (Phase 8) and
    # Payload URL generation — always forward the original.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server Components streaming / long admin operations.
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
