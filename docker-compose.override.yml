services:
  postgres:
    # Dev-only: expose Postgres to the host for `pnpm dev`, payload
    # migrate/generate commands, and integration tests.
    ports:
      - "5432:5432"
  app:
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
