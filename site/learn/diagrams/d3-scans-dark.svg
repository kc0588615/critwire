<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-scans-dark-title d3-scans-dark-desc" id="d3-scans-dark-root">
        <title id="d3-scans-dark-title">A Seq Scan reads every page; an Index Scan fetches row by row; a Bitmap Heap Scan reads each matching page once</title>
        <desc id="d3-scans-dark-desc">Twelve table pages, six of them holding the nine matching rows: the sequential scan reads all twelve in order; the index scan makes nine reads in index order, three pages twice; the bitmap heap scan reads the six pages once each, in page order.</desc>
<defs>
      <style>#d3-scans-dark-root { --paper: #2d3142; --paper-2: #393e53; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #949eb2;
      --rule: rgba(245,245,245,0.12); --rule-solid: rgba(191,192,192,0.25); --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10);
      --read: rgba(245,245,245,0.16);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d3-scans-dark-root { font-family: var(--font-sans); color: var(--ink); }
      #d3-scans-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d3-scans-dark-root .diagram-container { overflow-x: visible; }
}
      #d3-scans-dark-root .bg { fill: var(--paper); }
      #d3-scans-dark-root .zone { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
      #d3-scans-dark-root .mask { fill: var(--paper); }
      #d3-scans-dark-root .zmask { fill: var(--paper-2); }
      #d3-scans-dark-root .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #d3-scans-dark-root .store { fill: var(--paper-2); stroke: var(--muted); stroke-width: 1; }
      #d3-scans-dark-root .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #d3-scans-dark-root .tag-box { fill: none; stroke: var(--soft); stroke-width: 0.8; }
      #d3-scans-dark-root .tag { fill: var(--soft); font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #d3-scans-dark-root .name { fill: var(--ink); font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
      #d3-scans-dark-root .ident { fill: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
      #d3-scans-dark-root .sub { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
      #d3-scans-dark-root .eyebrow-text { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; }
      #d3-scans-dark-root .label { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
      #d3-scans-dark-root .note { fill: var(--muted); font-family: var(--font-serif); font-size: 14px; font-style: italic; }
      #d3-scans-dark-root .arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #d3-scans-dark-root .arrow-accent { fill: none; stroke: var(--accent); stroke-width: 1.4; }
      #d3-scans-dark-root .dashed { stroke-dasharray: 5 4; }
      #d3-scans-dark-root .head { fill: var(--muted); }
      #d3-scans-dark-root .head-accent { fill: var(--accent); }
      #d3-scans-dark-root .rule-line { stroke: var(--rule-solid); stroke-width: 0.8; }
      #d3-scans-dark-root .page { fill: var(--paper); stroke: var(--rule-solid); stroke-width: 1; }
      #d3-scans-dark-root .page-read { fill: var(--read); stroke: var(--muted); stroke-width: 1; }
      #d3-scans-dark-root .dot { fill: var(--ink); }
      #d3-scans-dark-root .order { fill: var(--ink); font-family: var(--font-mono); font-size: 10px; font-weight: 500; }</style>
<marker id="d3-scans-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
<marker id="d3-scans-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-accent" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<text class="eyebrow-text" x="200" y="32">THE TABLE: 12 PAGES OF 8 KB, IN PHYSICAL ORDER</text>
<text class="name" x="24" y="64">Seq Scan</text>
<text class="sub" x="24" y="80">every page, in order</text>
<text class="eyebrow-text" x="24" y="100">12 PAGES READ</text>
