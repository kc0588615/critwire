<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="critwire-pipeline-title critwire-pipeline-desc" id="critwire-pipeline-root">
        <title id="critwire-pipeline-title">One offline build turns the committed data/ snapshots into every file the course's tools read</title>
        <desc id="critwire-pipeline-desc">Ingest commits snapshots to data/; pnpm derive writes the derived files; pnpm build writes /v1/, /learn/data/ with its Parquet files, the PostGIS loader learn_curriculum.sql, and the star's CSV files, which the browser, PostgreSQL with PostGIS, and Power BI Desktop read.</desc>
<defs>
      <style>#critwire-pipeline-root { --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --rule: rgba(45,49,66,0.12); --rule-solid: #bfc0c0; --accent: #bf4520; --accent-tint: rgba(191,69,32,0.08);
      --read: rgba(45,49,66,0.14);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #critwire-pipeline-root { font-family: var(--font-sans); color: var(--ink); }
      #critwire-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#critwire-pipeline-root .diagram-container { overflow-x: visible; }
}
      #critwire-pipeline-root .bg { fill: var(--paper); }
      #critwire-pipeline-root .zone { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
      #critwire-pipeline-root .mask { fill: var(--paper); }
      #critwire-pipeline-root .zmask { fill: var(--paper-2); }
      #critwire-pipeline-root .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #critwire-pipeline-root .store { fill: var(--paper-2); stroke: var(--muted); stroke-width: 1; }
      #critwire-pipeline-root .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #critwire-pipeline-root .tag-box { fill: none; stroke: var(--soft); stroke-width: 0.8; }
      #critwire-pipeline-root .tag { fill: var(--soft); font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #critwire-pipeline-root .name { fill: var(--ink); font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
      #critwire-pipeline-root .ident { fill: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
      #critwire-pipeline-root .sub { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
      #critwire-pipeline-root .eyebrow-text { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; }
      #critwire-pipeline-root .label { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
      #critwire-pipeline-root .note { fill: var(--muted); font-family: var(--font-serif); font-size: 14px; font-style: italic; }
      #critwire-pipeline-root .arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #critwire-pipeline-root .arrow-accent { fill: none; stroke: var(--accent); stroke-width: 1.4; }
      #critwire-pipeline-root .dashed { stroke-dasharray: 5 4; }
      #critwire-pipeline-root .head { fill: var(--muted); }
      #critwire-pipeline-root .head-accent { fill: var(--accent); }
      #critwire-pipeline-root .rule-line { stroke: var(--rule-solid); stroke-width: 0.8; }
      #critwire-pipeline-root .page { fill: var(--paper); stroke: var(--rule-solid); stroke-width: 1; }
      #critwire-pipeline-root .page-read { fill: var(--read); stroke: var(--muted); stroke-width: 1; }
      #critwire-pipeline-root .dot { fill: var(--ink); }
      #critwire-pipeline-root .order { fill: var(--ink); font-family: var(--font-mono); font-size: 10px; font-weight: 500; }</style>
<marker id="critwire-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
<marker id="critwire-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-accent" points="0 0, 8 3, 0 6"/></marker>
</defs>
