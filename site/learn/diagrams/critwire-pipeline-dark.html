<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From committed snapshots to the files every tool reads</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --paper-2: #393e53; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #949eb2;
      --rule: rgba(245,245,245,0.12); --rule-solid: rgba(191,192,192,0.25); --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10);
      --read: rgba(245,245,245,0.16);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 3rem 2rem; }
    .frame { max-width: 1200px; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
    .bg { fill: var(--paper); }
    .zone { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
    .mask { fill: var(--paper); }
    .zmask { fill: var(--paper-2); }
    .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .store { fill: var(--paper-2); stroke: var(--muted); stroke-width: 1; }
    .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .tag-box { fill: none; stroke: var(--soft); stroke-width: 0.8; }
    .tag { fill: var(--soft); font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
    .name { fill: var(--ink); font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
    .ident { fill: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
    .sub { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
    .eyebrow-text { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; }
    .label { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
    .note { fill: var(--muted); font-family: var(--font-serif); font-size: 14px; font-style: italic; }
    .arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .arrow-accent { fill: none; stroke: var(--accent); stroke-width: 1.4; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: var(--muted); }
    .head-accent { fill: var(--accent); }
    .rule-line { stroke: var(--rule-solid); stroke-width: 0.8; }
    .page { fill: var(--paper); stroke: var(--rule-solid); stroke-width: 1; }
    .page-read { fill: var(--read); stroke: var(--muted); stroke-width: 1; }
    .dot { fill: var(--ink); }
    .order { fill: var(--ink); font-family: var(--font-mono); font-size: 10px; font-weight: 500; }
  </style>
</head>
<body>

        <title id="critwire-pipeline-dark-title">One offline build turns the committed data/ snapshots into every file the course's tools read</title>
        <desc id="critwire-pipeline-dark-desc">Ingest commits snapshots to data/; pnpm derive writes the derived files; pnpm build writes /v1/, /learn/data/ with its Parquet files, the PostGIS loader learn_curriculum.sql, and the star's CSV files, which the browser, PostgreSQL with PostGIS, and Power BI Desktop read.</desc>
