<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="e5-refresh-title e5-refresh-desc" id="e5-refresh-root">
        <title id="e5-refresh-title">One refresh, one transaction: a held lock or an unchanged key skips, any error rolls back, and new rows commit with their key</title>
        <desc id="e5-refresh-desc">A scheduled run takes a transaction lock, compares the job key (input, transform, config, schema) with the state row's, fetches datasets.csv, verifies its sha256, stages it with COPY and checks the row count, replaces the target and upserts the state, then commits. A held lock or an equal key skips with exit 0; a failed fetch, checksum or count rolls everything back with exit 1.</desc>
<defs>
      <style>#e5-refresh-root { --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --rule: rgba(45,49,66,0.12); --rule-solid: #bfc0c0; --accent: #bf4520; --accent-tint: rgba(191,69,32,0.08);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #e5-refresh-root { font-family: var(--font-sans); color: var(--ink); }
      #e5-refresh-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#e5-refresh-root .diagram-container { overflow-x: visible; }
}
      #e5-refresh-root .bg { fill: var(--paper); }
      #e5-refresh-root .zone { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
      #e5-refresh-root .mask { fill: var(--paper); }
      #e5-refresh-root .zmask { fill: var(--paper-2); }
      #e5-refresh-root .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #e5-refresh-root .store { fill: var(--paper-2); stroke: var(--muted); stroke-width: 1; }
      #e5-refresh-root .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #e5-refresh-root .name { fill: var(--ink); font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
      #e5-refresh-root .sub { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
      #e5-refresh-root .eyebrow-text { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; }
      #e5-refresh-root .label { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
      #e5-refresh-root .note { fill: var(--muted); font-family: var(--font-serif); font-size: 14px; font-style: italic; }
      #e5-refresh-root .arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #e5-refresh-root .arrow-accent { fill: none; stroke: var(--accent); stroke-width: 1.4; }
      #e5-refresh-root .dashed { stroke-dasharray: 5 4; }
      #e5-refresh-root .head { fill: var(--muted); }
      #e5-refresh-root .head-accent { fill: var(--accent); }
      #e5-refresh-root .rule-line { stroke: var(--rule-solid); stroke-width: 0.8; }</style>
<marker id="e5-refresh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
<marker id="e5-refresh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-accent" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="zone" x="24" y="40" width="488" height="564" rx="6"/>
<text class="eyebrow-text" x="40" y="60">ONE TRANSACTION</text>
<path class="arrow" d="M192 128 V152" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow" d="M192 204 V228" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow" d="M192 280 V304" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow" d="M192 356 V380" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow" d="M192 432 V456" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow" d="M192 508 V532" marker-end="url(#e5-refresh-arrow)"/>
<text class="label" x="202" y="143">LOCK TAKEN</text>
<text class="label" x="202" y="219">KEY CHANGED</text>
<path class="arrow dashed" d="M328 102 H568" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow dashed" d="M328 178 H568" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow" d="M328 254 H568" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow" d="M328 330 H568" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow" d="M328 406 H568" marker-end="url(#e5-refresh-arrow)"/>
<path class="arrow-accent" d="M328 558 H568" marker-end="url(#e5-refresh-arrow-accent)"/>
<rect class="zmask" x="419.2" y="84" width="57.5" height="12" rx="2"/>
<text class="label" x="448" y="93" text-anchor="middle">LOCK HELD</text>
<rect class="zmask" x="407.4" y="160" width="81.2" height="12" rx="2"/>
<text class="label" x="448" y="169" text-anchor="middle">KEY UNCHANGED</text>
<rect class="zmask" x="413.4" y="236" width="69.3" height="12" rx="2"/>
<text class="label" x="448" y="245" text-anchor="middle">FETCH FAILS</text>
<rect class="zmask" x="404.4" y="312" width="87.2" height="12" rx="2"/>
<text class="label" x="448" y="321" text-anchor="middle">SHA256 DIFFERS</text>
<rect class="zmask" x="407.4" y="388" width="81.2" height="12" rx="2"/>
<text class="label" x="448" y="397" text-anchor="middle">COUNT DIFFERS</text>
<rect class="mask" x="56" y="76" width="272" height="52" rx="6"/>
<rect class="node" x="56" y="76" width="272" height="52" rx="6"/>
<text class="name" x="192" y="98" text-anchor="middle">Lock</text>
<text class="sub" x="192" y="114" text-anchor="middle">pg_try_advisory_xact_lock</text>
<rect class="mask" x="56" y="152" width="272" height="52" rx="6"/>
<rect class="node" x="56" y="152" width="272" height="52" rx="6"/>
<text class="name" x="192" y="174" text-anchor="middle">Compare the job key</text>
<text class="sub" x="192" y="190" text-anchor="middle">input · transform · config · schema</text>
<rect class="mask" x="56" y="228" width="272" height="52" rx="6"/>
<rect class="node" x="56" y="228" width="272" height="52" rx="6"/>
<text class="name" x="192" y="250" text-anchor="middle">Fetch the file</text>
<text class="sub" x="192" y="266" text-anchor="middle">datasets.csv</text>
<rect class="mask" x="56" y="304" width="272" height="52" rx="6"/>
<rect class="node" x="56" y="304" width="272" height="52" rx="6"/>
<text class="name" x="192" y="326" text-anchor="middle">Verify</text>
<text class="sub" x="192" y="342" text-anchor="middle">sha256 = the manifest's</text>
<rect class="mask" x="56" y="380" width="272" height="52" rx="6"/>
<rect class="node" x="56" y="380" width="272" height="52" rx="6"/>
<text class="name" x="192" y="402" text-anchor="middle">Stage and count</text>
<text class="sub" x="192" y="418" text-anchor="middle">COPY into TEMP · rows = the manifest's</text>
<rect class="mask" x="56" y="456" width="272" height="52" rx="6"/>
<rect class="node" x="56" y="456" width="272" height="52" rx="6"/>
<text class="name" x="192" y="478" text-anchor="middle">Replace + state</text>
<text class="sub" x="192" y="494" text-anchor="middle">TRUNCATE, INSERT · upsert the key</text>
<rect class="mask" x="56" y="532" width="272" height="52" rx="6"/>
<rect class="focal" x="56" y="532" width="272" height="52" rx="6"/>
<text class="name" x="192" y="554" text-anchor="middle">COMMIT</text>
<text class="sub" x="192" y="570" text-anchor="middle">frees the lock</text>
<rect class="mask" x="568" y="76" width="208" height="128" rx="6"/>
<rect class="store" x="568" y="76" width="208" height="128" rx="6"/>
<text class="name" x="672" y="136" text-anchor="middle">Skipped, exit 0</text>
<text class="sub" x="672" y="152" text-anchor="middle">nothing written</text>
<rect class="mask" x="568" y="228" width="208" height="204" rx="6"/>
<rect class="store" x="568" y="228" width="208" height="204" rx="6"/>
<text class="name" x="672" y="310" text-anchor="middle">ROLLBACK, exit 1</text>
<text class="sub" x="672" y="326" text-anchor="middle">target and key unchanged</text>
<text class="sub" x="672" y="342" text-anchor="middle">the reason in the log</text>
<text class="sub" x="672" y="358" text-anchor="middle">traceback on stderr</text>
<rect class="mask" x="568" y="532" width="208" height="52" rx="6"/>
<rect class="node" x="568" y="532" width="208" height="52" rx="6"/>
<text class="name" x="672" y="554" text-anchor="middle">Loaded, exit 0</text>
<text class="sub" x="672" y="570" text-anchor="middle">new rows and their key</text>
<text class="note" x="24" y="636">An unchanged key or a held lock skips, and any error rolls the whole run back:</text>
<text class="note" x="24" y="658">the target and the key it was loaded with change together, or not at all.</text>
<line class="rule-line" x1="24" y1="674" x2="776" y2="674"/>
<text class="label" x="24" y="692">JOB KEY: ONE CHECKSUM OVER THE INPUT'S SHA256, TRANSFORM_VERSION, THE CONFIG AND SCHEMA_VERSION</text>
      </svg>
