<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="g3-predicates-title g3-predicates-desc" id="g3-predicates-root">
        <title id="g3-predicates-title">ST_Contains leaves out a point on a polygon's edge, ST_Covers and ST_Intersects keep it; where outlines overlap, a spatial join returns one record twice</title>
        <desc id="g3-predicates-desc">Left: a square with a point inside, a point on its edge and a point outside; ST_Contains is true only for the inside point, ST_Covers and ST_Intersects for the inside and edge points, none for the outside point. Right: France's outline has two parts, the mainland and an overseas region, and French Guiana's own outline covers the same area as the second part; a record in the mainland joins one outline, a record in French Guiana joins two, FR and GF. In the lab sample 933 records join two outlines.</desc>
  <defs>
      <style>#g3-predicates-root { --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --rule: rgba(45,49,66,0.12); --rule-solid: #bfc0c0; --accent: #bf4520; --accent-tint: rgba(191,69,32,0.08);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #g3-predicates-root { font-family: var(--font-sans); color: var(--ink); }
      #g3-predicates-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#g3-predicates-root .diagram-container { overflow-x: visible; }
}
      #g3-predicates-root .bg { fill: var(--paper); }
      #g3-predicates-root .zone { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
      #g3-predicates-root .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #g3-predicates-root .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #g3-predicates-root .hot-col { fill: var(--accent-tint); stroke: none; }
      #g3-predicates-root .name { fill: var(--ink); font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
      #g3-predicates-root .name-accent { fill: var(--accent); font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
      #g3-predicates-root .ident { fill: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
      #g3-predicates-root .sub { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
      #g3-predicates-root .val-yes { fill: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
      #g3-predicates-root .val-no { fill: var(--soft); font-family: var(--font-mono); font-size: 11px; }
      #g3-predicates-root .val-hot { fill: var(--accent); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
      #g3-predicates-root .eyebrow-text { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; }
      #g3-predicates-root .label { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
      #g3-predicates-root .label-accent { fill: var(--accent); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
      #g3-predicates-root .note { fill: var(--muted); font-family: var(--font-serif); font-size: 14px; font-style: italic; }
      #g3-predicates-root .rule-line { stroke: var(--rule-solid); stroke-width: 0.8; }
      #g3-predicates-root .dot { fill: var(--ink); }
      #g3-predicates-root .dot-accent { fill: var(--accent); }</style>
  </defs>
<rect class="bg" width="100%" height="100%"/>
<rect class="zone" x="24" y="40" width="368" height="276" rx="6"/>
<text class="eyebrow-text" x="40" y="60">THREE PREDICATES, ONE SQUARE</text>
<rect class="node" x="56" y="80" width="120" height="120"/>
<text class="label" x="64" y="96">POLYGON A</text>
<circle class="dot" cx="100" cy="140" r="5"/>
<circle class="dot-accent" cx="176" cy="140" r="5"/>
<circle class="dot" cx="256" cy="140" r="5"/>
<text class="label" x="100" y="222" text-anchor="middle">INSIDE</text>
<text class="label-accent" x="176" y="222" text-anchor="middle">ON THE EDGE</text>
<text class="label" x="256" y="222" text-anchor="middle">OUTSIDE</text>
<line class="rule-line" x1="40" y1="234" x2="376" y2="234"/>
<rect class="hot-col" x="148" y="238" width="56" height="66" rx="3"/>
<text class="val-yes" x="100" y="256" text-anchor="middle">true</text>
<text class="val-hot" x="176" y="256" text-anchor="middle">false</text>
<text class="val-no" x="256" y="256" text-anchor="middle">false</text>
<text class="ident" x="292" y="256">ST_Contains</text>
<text class="val-yes" x="100" y="276" text-anchor="middle">true</text>
<text class="val-hot" x="176" y="276" text-anchor="middle">true</text>
<text class="val-no" x="256" y="276" text-anchor="middle">false</text>
<text class="ident" x="292" y="276">ST_Covers</text>
<text class="val-yes" x="100" y="296" text-anchor="middle">true</text>
<text class="val-hot" x="176" y="296" text-anchor="middle">true</text>
<text class="val-no" x="256" y="296" text-anchor="middle">false</text>
<text class="ident" x="292" y="296">ST_Intersects</text>
<rect class="zone" x="408" y="40" width="368" height="276" rx="6"/>
<text class="eyebrow-text" x="424" y="60">OVERLAPPING OUTLINES COUNT TWICE</text>
<rect class="node" x="440" y="84" width="128" height="104"/>
<text class="label" x="448" y="100">FR · MAINLAND</text>
<rect class="node" x="616" y="132" width="136" height="112"/>
<text class="label" x="624" y="148">FR · OVERSEAS PART</text>
<rect class="focal" x="624" y="156" width="120" height="80"/>
<text class="label-accent" x="632" y="172">GF · OWN OUTLINE</text>
<circle class="dot" cx="504" cy="146" r="5"/>
<circle class="dot-accent" cx="684" cy="206" r="5"/>
<text class="name" x="504" y="216" text-anchor="middle">1 row</text>
<text class="sub" x="504" y="232" text-anchor="middle">FR</text>
<text class="name-accent" x="684" y="268" text-anchor="middle">2 rows</text>
<text class="sub" x="684" y="284" text-anchor="middle">FR and GF</text>
<text class="sub" x="440" y="264">JOIN ON ST_Covers(</text>
<text class="sub" x="440" y="280">  outline, record):</text>
<text class="sub" x="440" y="296">a row per outline</text>
<text class="note" x="24" y="348">On a shared edge, ST_Covers puts a point in both neighbours and ST_Contains in neither.</text>
<text class="note" x="24" y="370">Where outlines overlap, the join returns one row per outline: 933 sample records come back twice.</text>
<line class="rule-line" x1="24" y1="386" x2="776" y2="386"/>
<text class="label" x="24" y="404">SHAPES ILLUSTRATIVE · COUNTS FROM THE LAB SAMPLE (g3-two-outlines)</text>
      </svg>
