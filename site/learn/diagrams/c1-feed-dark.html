    .sub { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
    .eyebrow-text { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; }
    .label { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
    .note { fill: var(--muted); font-family: var(--font-serif); font-size: 14px; font-style: italic; }
    .arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .arrow-accent { fill: none; stroke: var(--accent); stroke-width: 1.4; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: var(--muted); }
    .head-accent { fill: var(--accent); }
    .rule-line { stroke: var(--rule-solid); stroke-width: 0.8; }
    .rule-text { fill: var(--ink); font-family: var(--font-sans); font-size: 12.5px; }

    <p class="eyebrow">The game feed · c1</p>
    <h1>One cell, its weight, and one draw</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 708" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c1-feed-dark-title c1-feed-dark-desc">
        <title id="c1-feed-dark-title">A cell's weight is its share of the feed's records; the game draws a cell with one random number on the running sum of the weights, and a cell missing from the feed means no record, never no animal</title>
        <desc id="c1-feed-dark-desc">The fullest cell of the worked feed, 917, has id, lon, lat, 256 records, weight 0.129817 (256 of 1,972 records, rounded to six places) and recording_hot_spot true. The 307 weights sum to 0.999954, so the game divides by their sum. The draw: add the weights in id order, take one random number r between 0 and the total (here 0.83), and pick the first cell whose running sum passes it: cell 917, whose span runs from 0.768217 to 0.898034. Cell 7 has no record, so the feed leaves it out: a missing cell means no record there, never no animal.</desc>

<text class="eyebrow-text" x="424" y="44">WEIGHT = ITS SHARE OF THE RECORDS</text>
<text class="name" x="424" y="80">256 ÷ 1,972 = 0.129817</text>
<text class="sub" x="424" y="98">its records ÷ all the feed's records,</text>
<text class="sub" x="424" y="112">rounded to six places</text>
<text class="rule-text" x="424" y="146">The 307 weights sum to 0.999954, not 1,</text>
<text class="rule-text" x="424" y="164">so the game divides by their sum.</text>
<text class="rule-text" x="424" y="200">A weight says where people recorded</text>
<text class="rule-text" x="424" y="218">the animal, not its range.</text>
