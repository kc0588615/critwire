<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d6-drill-across-title d6-drill-across-desc" id="d6-drill-across-root">
        <title id="d6-drill-across-title">Sum each fact to the shared dimension, then join: joining two facts row to row multiplies their rows</title>
        <desc id="d6-drill-across-desc">Joining fact_records (2 rows for Trinidad and Tobago) to fact_country_habitat (22 rows) gives 44 rows, doubles the habitat area and drops Åland; summing each fact by country first and joining on dim_country gives each number once.</desc>
<defs>
      <style>#d6-drill-across-root { --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --rule: rgba(45,49,66,0.12); --rule-solid: #bfc0c0; --accent: #bf4520; --accent-tint: rgba(191,69,32,0.08);
      --read: rgba(45,49,66,0.14);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #d6-drill-across-root { font-family: var(--font-sans); color: var(--ink); }
      #d6-drill-across-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d6-drill-across-root .diagram-container { overflow-x: visible; }
}
      #d6-drill-across-root .bg { fill: var(--paper); }
      #d6-drill-across-root .zone { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
      #d6-drill-across-root .mask { fill: var(--paper); }
      #d6-drill-across-root .zmask { fill: var(--paper-2); }
      #d6-drill-across-root .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #d6-drill-across-root .store { fill: var(--paper-2); stroke: var(--muted); stroke-width: 1; }
      #d6-drill-across-root .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #d6-drill-across-root .tag-box { fill: none; stroke: var(--soft); stroke-width: 0.8; }
      #d6-drill-across-root .tag { fill: var(--soft); font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #d6-drill-across-root .name { fill: var(--ink); font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
      #d6-drill-across-root .ident { fill: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
      #d6-drill-across-root .sub { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
      #d6-drill-across-root .eyebrow-text { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; }
      #d6-drill-across-root .label { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
      #d6-drill-across-root .note { fill: var(--muted); font-family: var(--font-serif); font-size: 14px; font-style: italic; }
      #d6-drill-across-root .arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #d6-drill-across-root .arrow-accent { fill: none; stroke: var(--accent); stroke-width: 1.4; }
      #d6-drill-across-root .dashed { stroke-dasharray: 5 4; }
      #d6-drill-across-root .head { fill: var(--muted); }
      #d6-drill-across-root .head-accent { fill: var(--accent); }
      #d6-drill-across-root .rule-line { stroke: var(--rule-solid); stroke-width: 0.8; }
      #d6-drill-across-root .page { fill: var(--paper); stroke: var(--rule-solid); stroke-width: 1; }
      #d6-drill-across-root .page-read { fill: var(--read); stroke: var(--muted); stroke-width: 1; }
      #d6-drill-across-root .dot { fill: var(--ink); }
      #d6-drill-across-root .order { fill: var(--ink); font-family: var(--font-mono); font-size: 10px; font-weight: 500; }</style>
<marker id="d6-drill-across-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
<marker id="d6-drill-across-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-accent" points="0 0, 8 3, 0 6"/></marker>
</defs>
