    .bg { fill: var(--paper); }
    .zone { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }

    .zmask { fill: var(--paper-2); }
    .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }

    .arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .arrow-accent { fill: none; stroke: var(--accent); stroke-width: 1.4; }
    .dashed { stroke-dasharray: 5 4; }

    .head-accent { fill: var(--accent); }
    .band { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.4; }
    .band-zone { fill: var(--accent-tint); }
    .band-line { stroke: var(--accent); stroke-width: 1.4; }
    .ring { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
    .radius { fill: none; stroke: var(--ink); stroke-width: 1; }
    .radius-accent { fill: none; stroke: var(--accent); stroke-width: 1.2; }
    .dot { fill: var(--muted); }
    .dot-accent { fill: var(--accent); }
    .axis { stroke: var(--muted); stroke-width: 1; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .gap { fill: none; stroke: var(--soft); stroke-width: 0.8; }
    .label-accent { fill: var(--accent); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
    .rule-line { stroke: var(--rule-solid); stroke-width: 0.8; }

    <h1>Why the band is twice the edge</h1>

        <title id="s4-band-title">Why the band is twice the edge: touching hexagons' centroids are 1.73 edges apart and the next ring's 3, so a 2-edge band holds exactly the six touching cells</title>
        <desc id="s4-band-desc">A flat-topped hexagon grid with edge e, as ST_HexagonGrid makes it. The middle cell's six touching cells have centroids √3·e (about 1.73·e) away; the next ring's are 3·e and 2√3·e (about 3.46·e) away. A distance band of 2·e lies between √3·e and 3·e, 0.27·e beyond the touching cells and a whole edge short of the next ring, so it selects exactly the touching cells and no pair sits near the threshold.</desc>

<text class="sub" x="440" y="398">e = 5 km: band 10 km, touching cells 8.66 km apart,</text>
<text class="sub" x="440" y="414">the next ring from 15 km. e = 10 km: all doubled.</text>
<text class="note" x="24" y="478">A band of twice the edge holds exactly the six cells that touch, and no centroid lies</text>
<text class="note" x="24" y="500">within 0.27·e of it, so a rounding difference between SQL and PySAL can't move a pair across.</text>

<text class="label" x="24" y="534">S4_NEIGHBOURS: ST_DWITHIN(CENTROID_A, CENTROID_B, 2 * EDGE_M) · PYSAL: DISTANCEBAND(THRESHOLD = 2 * EDGE)</text>
