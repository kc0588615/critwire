<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three ways to read a table</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #2d3142; --paper-2: #393e53; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #949eb2;
      --rule: rgba(245,245,245,0.12); --rule-solid: rgba(191,192,192,0.25); --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10);
      --read: rgba(245,245,245,0.16);
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 3rem 2rem; }
    .frame { max-width: 1200px; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: 1.75rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
    .bg { fill: var(--paper); }
    .zone { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
    .mask { fill: var(--paper); }
    .zmask { fill: var(--paper-2); }
    .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .store { fill: var(--paper-2); stroke: var(--muted); stroke-width: 1; }
    .focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .tag-box { fill: none; stroke: var(--soft); stroke-width: 0.8; }
    .tag { fill: var(--soft); font-family: var(--font-mono); font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
    .name { fill: var(--ink); font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
    .ident { fill: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
    .sub { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
    .eyebrow-text { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; font-weight: 500; letter-spacing: 0.14em; }
    .label { fill: var(--soft); font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; }
    .note { fill: var(--muted); font-family: var(--font-serif); font-size: 14px; font-style: italic; }
    .arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .arrow-accent { fill: none; stroke: var(--accent); stroke-width: 1.4; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: var(--muted); }
    .head-accent { fill: var(--accent); }
    .rule-line { stroke: var(--rule-solid); stroke-width: 0.8; }
    .page { fill: var(--paper); stroke: var(--rule-solid); stroke-width: 1; }
    .page-read { fill: var(--read); stroke: var(--muted); stroke-width: 1; }
    .dot { fill: var(--ink); }
    .order { fill: var(--ink); font-family: var(--font-mono); font-size: 10px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Scans · d3</p>
    <h1>Three ways to read a table</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-scans-dark-title d3-scans-dark-desc">
        <title id="d3-scans-dark-title">A Seq Scan reads every page; an Index Scan fetches row by row; a Bitmap Heap Scan reads each matching page once</title>
        <desc id="d3-scans-dark-desc">Twelve table pages, six of them holding the nine matching rows: the sequential scan reads all twelve in order; the index scan makes nine reads in index order, three pages twice; the bitmap heap scan reads the six pages once each, in page order.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head-accent" points="0 0, 8 3, 0 6"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/>
<text class="eyebrow-text" x="200" y="32">THE TABLE: 12 PAGES OF 8 KB, IN PHYSICAL ORDER</text>
<text class="name" x="24" y="64">Seq Scan</text>
<text class="sub" x="24" y="80">every page, in order</text>
<text class="eyebrow-text" x="24" y="100">12 PAGES READ</text>
<rect class="page-read" x="200" y="48" width="40" height="40" rx="3"/>
<circle class="dot" cx="220" cy="68" r="4"/>
<text class="order" x="220" y="104" text-anchor="middle">1</text>
<rect class="page-read" x="248" y="48" width="40" height="40" rx="3"/>
<text class="order" x="268" y="104" text-anchor="middle">2</text>
<rect class="page-read" x="296" y="48" width="40" height="40" rx="3"/>
<circle class="dot" cx="316" cy="68" r="4"/>
<text class="order" x="316" y="104" text-anchor="middle">3</text>
<rect class="page-read" x="344" y="48" width="40" height="40" rx="3"/>
<circle class="dot" cx="364" cy="68" r="4"/>
<text class="order" x="364" y="104" text-anchor="middle">4</text>
<rect class="page-read" x="392" y="48" width="40" height="40" rx="3"/>
<text class="order" x="412" y="104" text-anchor="middle">5</text>
<rect class="page-read" x="440" y="48" width="40" height="40" rx="3"/>
<circle class="dot" cx="460" cy="68" r="4"/>
<text class="order" x="460" y="104" text-anchor="middle">6</text>
<rect class="page-read" x="488" y="48" width="40" height="40" rx="3"/>
<text class="order" x="508" y="104" text-anchor="middle">7</text>
<rect class="page-read" x="536" y="48" width="40" height="40" rx="3"/>
<text class="order" x="556" y="104" text-anchor="middle">8</text>
<rect class="page-read" x="584" y="48" width="40" height="40" rx="3"/>
<circle class="dot" cx="604" cy="68" r="4"/>
<text class="order" x="604" y="104" text-anchor="middle">9</text>
<rect class="page-read" x="632" y="48" width="40" height="40" rx="3"/>
<text class="order" x="652" y="104" text-anchor="middle">10</text>
<rect class="page-read" x="680" y="48" width="40" height="40" rx="3"/>
<circle class="dot" cx="700" cy="68" r="4"/>
<text class="order" x="700" y="104" text-anchor="middle">11</text>
<rect class="page-read" x="728" y="48" width="40" height="40" rx="3"/>
<text class="order" x="748" y="104" text-anchor="middle">12</text>
<text class="name" x="24" y="152">Index Scan</text>
<text class="sub" x="24" y="168">row by row, index order</text>
<text class="eyebrow-text" x="24" y="188">9 READS, 6 PAGES</text>
<rect class="page-read" x="200" y="136" width="40" height="40" rx="3"/>
<circle class="dot" cx="220" cy="156" r="4"/>
<text class="order" x="220" y="192" text-anchor="middle">6</text>
<rect class="page" x="248" y="136" width="40" height="40" rx="3"/>
<rect class="page-read" x="296" y="136" width="40" height="40" rx="3"/>
<circle class="dot" cx="316" cy="156" r="4"/>
<text class="order" x="316" y="192" text-anchor="middle">1 3</text>
<rect class="page-read" x="344" y="136" width="40" height="40" rx="3"/>
<circle class="dot" cx="364" cy="156" r="4"/>
<text class="order" x="364" y="192" text-anchor="middle">9</text>
<rect class="page" x="392" y="136" width="40" height="40" rx="3"/>
<rect class="page-read" x="440" y="136" width="40" height="40" rx="3"/>
<circle class="dot" cx="460" cy="156" r="4"/>
<text class="order" x="460" y="192" text-anchor="middle">4 8</text>
<rect class="page" x="488" y="136" width="40" height="40" rx="3"/>
<rect class="page" x="536" y="136" width="40" height="40" rx="3"/>
<rect class="page-read" x="584" y="136" width="40" height="40" rx="3"/>
<circle class="dot" cx="604" cy="156" r="4"/>
<text class="order" x="604" y="192" text-anchor="middle">2 7</text>
<rect class="page" x="632" y="136" width="40" height="40" rx="3"/>
<rect class="page-read" x="680" y="136" width="40" height="40" rx="3"/>
<circle class="dot" cx="700" cy="156" r="4"/>
<text class="order" x="700" y="192" text-anchor="middle">5</text>
<rect class="page" x="728" y="136" width="40" height="40" rx="3"/>
<text class="name" x="24" y="240">Bitmap Heap Scan</text>
<text class="sub" x="24" y="256">matching pages, once</text>
<text class="eyebrow-text" x="24" y="276">6 PAGES READ</text>
<rect class="page-read" x="200" y="224" width="40" height="40" rx="3"/>
<circle class="dot" cx="220" cy="244" r="4"/>
<text class="order" x="220" y="280" text-anchor="middle">1</text>
<rect class="page" x="248" y="224" width="40" height="40" rx="3"/>
<rect class="page-read" x="296" y="224" width="40" height="40" rx="3"/>
<circle class="dot" cx="316" cy="244" r="4"/>
<text class="order" x="316" y="280" text-anchor="middle">2</text>
<rect class="page-read" x="344" y="224" width="40" height="40" rx="3"/>
<circle class="dot" cx="364" cy="244" r="4"/>
<text class="order" x="364" y="280" text-anchor="middle">3</text>
<rect class="page" x="392" y="224" width="40" height="40" rx="3"/>
<rect class="page-read" x="440" y="224" width="40" height="40" rx="3"/>
<circle class="dot" cx="460" cy="244" r="4"/>
<text class="order" x="460" y="280" text-anchor="middle">4</text>
<rect class="page" x="488" y="224" width="40" height="40" rx="3"/>
<rect class="page" x="536" y="224" width="40" height="40" rx="3"/>
<rect class="page-read" x="584" y="224" width="40" height="40" rx="3"/>
<circle class="dot" cx="604" cy="244" r="4"/>
<text class="order" x="604" y="280" text-anchor="middle">5</text>
<rect class="page" x="632" y="224" width="40" height="40" rx="3"/>
<rect class="page-read" x="680" y="224" width="40" height="40" rx="3"/>
<circle class="dot" cx="700" cy="244" r="4"/>
<text class="order" x="700" y="280" text-anchor="middle">6</text>
<rect class="page" x="728" y="224" width="40" height="40" rx="3"/>
<line class="rule-line" x1="24" y1="296" x2="776" y2="296"/>
<text class="eyebrow-text" x="24" y="316">LEGEND</text>
<rect class="page-read" x="112" y="304" width="16" height="16" rx="2"/>
<text class="label" x="136" y="316">PAGE READ</text>
<rect class="page" x="248" y="304" width="16" height="16" rx="2"/>
<circle class="dot" cx="256" cy="312" r="4"/>
<text class="label" x="272" y="316">HOLDS A MATCHING ROW</text>
<text class="order" x="456" y="316">1 2 3</text>
<text class="label" x="496" y="316">ORDER OF THE READS</text>
      </svg>
    </div>
  </div>
</body>
</html>
